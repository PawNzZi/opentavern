name: tavern_app
description: "A local-first SillyTavern client for iOS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  path_provider: ^2.1.5
  file_picker: ^13.3.3
  archive: ^3.6.1
  xml: ^6.6.1
  native_liquid_glass: ^0.3.1
  # 小说导入：GBK/GB18030 中文文本解码（dart:convert 只有 utf8/latin1）。
  enough_convert: ^1.7.1
  # 长时间生成期间防止 iOS 锁屏挂起（配合断点续跑）。
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf


